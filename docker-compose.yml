version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ai_receptionist_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: ai_receptionist
      MYSQL_USER: ai_receptionist
      MYSQL_PASSWORD: change_in_production
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ai_receptionist", "-pchange_in_production"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: ai_receptionist_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_receptionist_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=ai_receptionist
      - DATABASE_PASSWORD=change_in_production
      - DATABASE_NAME=ai_receptionist
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./assets:/app/assets
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    devices:
      - /dev/video0:/dev/video0

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_receptionist_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
