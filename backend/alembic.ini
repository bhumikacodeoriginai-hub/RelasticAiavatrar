# Alembic Configuration
# ====================
# Database migrations for AI Avatar Receptionist
#
# Usage:
#   alembic upgrade head        # Apply all migrations
#   alembic revision --autogenerate -m "description"  # Create new migration
#   alembic downgrade -1        # Rollback one migration
#   alembic history             # Show migration history
#   alembic current             # Show current revision

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use for file template (UTC)
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to true to run each revision in its own transaction
revision_environment = false

# Connection string — loaded from environment in env.py, not hardcoded here
# sqlalchemy.url is intentionally left empty; env.py reads from config
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
